on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rust:
        description: Rust toolchain
        type: choice
        default: stable
        options:
          - stable
          - nightly
          - both
      os:
        description: Runner OS (also selects matching cross-target hosts)
        type: choice
        default: all
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest
      include_cross:
        description: Include Android and iOS cross-target builds
        type: boolean
        default: true
      run_tests:
        description: Run unit and netsim integration tests
        type: boolean
        default: true
      run_lint:
        description: Run rustfmt and Clippy
        type: boolean
        default: true

name: ipfs-embed

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      toolchains: ${{ steps.matrix.outputs.toolchains }}
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - name: Select toolchains and platforms
        id: matrix
        shell: python
        env:
          SELECTED_RUST: ${{ inputs.rust || 'stable' }}
          SELECTED_OS: ${{ inputs.os || 'all' }}
          INCLUDE_CROSS: ${{ github.event_name != 'workflow_dispatch' || inputs.include_cross }}
        run: |
          import json
          import os

          rust = os.environ["SELECTED_RUST"]
          toolchains = ["stable", "nightly"] if rust == "both" else [rust]
          platforms = [
              {"target": "x86_64-unknown-linux-gnu", "host": "ubuntu-latest", "cross": False},
              {"target": "x86_64-apple-darwin", "host": "macos-latest", "cross": False},
              {"target": "x86_64-pc-windows-msvc", "host": "windows-latest", "cross": False},
              {"target": "armv7-linux-androideabi", "host": "ubuntu-latest", "cross": True},
              {"target": "aarch64-linux-android", "host": "ubuntu-latest", "cross": True},
              {"target": "aarch64-apple-ios", "host": "macos-latest", "cross": True},
          ]
          selected_os = os.environ["SELECTED_OS"]
          include_cross = os.environ["INCLUDE_CROSS"] == "true"
          platforms = [
              platform for platform in platforms
              if (selected_os == "all" or platform["host"] == selected_os)
              and (include_cross or not platform["cross"])
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"toolchains={json.dumps(toolchains)}\n")
              output.write(f"platforms={json.dumps(platforms)}\n")

  ci:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(needs.prepare-matrix.outputs.toolchains) }}
        platform: ${{ fromJSON(needs.prepare-matrix.outputs.platforms) }}
    env:
      RUST_BACKTRACE: 1
      RUST_LOG: netsim_embed_machine=debug,info
      CARGO_INCREMENTAL: 0
      LLVM_CONFIG_PATH: /usr/local/opt/llvm/bin/llvm-config
      NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle

    runs-on: ${{ matrix.platform.host }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Cache cargo folder
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.platform.target }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies ubuntu
        if: matrix.platform.host == 'ubuntu-latest'
        run: sudo apt-get install llvm-dev

      - name: Install dependencies macos
        if: matrix.platform.host == 'macos-latest'
        run: brew install llvm

      - name: Install dependencies windows
        if: matrix.platform.host == 'windows-latest'
        run: choco install llvm

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}
          override: true

      - name: Install cargo-apk
        if: contains(matrix.platform.target, 'android')
        uses: baptiste0928/cargo-install@bf6758885262d0e6f61089a9d8c8790d3ac3368f # v1.3.0
        with:
          crate: cargo-apk

      - name: Build
        if: contains(matrix.platform.target, 'android') == false
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --target ${{ matrix.platform.target }}

      - name: Build Tokio
        if: contains(matrix.platform.target, 'android') == false
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --target ${{ matrix.platform.target }} --no-default-features --features tokio

      - name: Build android
        if: contains(matrix.platform.target, 'android')
        uses: actions-rs/cargo@v1
        with:
          command: apk
          args: -- build --target ${{ matrix.platform.target }} -p ipfs-embed

      - name: Rust tests
        if: matrix.platform.cross == false && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        uses: actions-rs/cargo@v1
        with:
          command: test

      - name: Build netsim integration tests
        if: contains(matrix.platform.target, 'linux-gnu') && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: -p ipfs-embed-cli -p harness --release

      - name: Run netsim integration tests
        if: contains(matrix.platform.target, 'linux-gnu') && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release -p harness

  lint-rust:
    needs: prepare-matrix
    if: github.event_name != 'workflow_dispatch' || inputs.run_lint
    strategy:
      fail-fast: false
      matrix:
        rust: ${{ fromJSON(needs.prepare-matrix.outputs.toolchains) }}
    runs-on: ${{ inputs.os != 'all' && inputs.os || 'ubuntu-latest' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Cache cargo folder
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          profile: minimal
          components: clippy, rustfmt
          override: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --examples --tests -- -D warnings
